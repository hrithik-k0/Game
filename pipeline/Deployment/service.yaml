apiVersion: v1
kind: Service
metadata:
  name: rps-game-service
  namespace: default
  labels:
    app: rps-game
spec:
  type: NodePort          # NodePort works perfectly with minikube
  selector:
    app: rps-game
  ports:
    - protocol: TCP
      port: 80            # Service port
      targetPort: 80      # Container port
      nodePort: 30080     # Access via minikube IP:30080